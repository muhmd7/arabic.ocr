<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>ماسح النصوص العربية</title>
<style>
:root{--bg:#f6f7f7;--card:#fff;--tx:#111;--mut:#666;--ac:#0f766e;--bd:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--tx:#eee;--mut:#999;--bd:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 20px)}
main{max-width:640px;margin:0 auto}
h1{font-size:20px;margin:18px 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,label.btn{flex:1;min-width:120px;padding:13px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-size:15px;text-align:center;cursor:pointer;font-family:inherit}
button.sec,label.btn.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.5}
input[type=file]{display:none}
#preview{max-width:100%;max-height:280px;border-radius:8px;display:none;margin:0 auto 10px}
textarea{width:100%;min-height:220px;border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:18px;line-height:1.8;background:var(--bg);color:var(--tx);font-family:inherit;direction:rtl;resize:vertical}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0 4px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#status{font-size:13px;color:var(--mut);min-height:18px}
.opt{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
#net{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>ماسح النصوص العربية</h1>
<p class="sub">يعمل بدون إنترنت <span id="net"></span></p>

<div class="card">
  <img id="preview" alt="">
  <div class="row">
    <label class="btn">📷 التقاط صورة<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn sec">🖼️ من المعرض<input id="gal" type="file" accept="image/*" multiple></label>
  </div>
  <label class="opt"><input id="enh" type="checkbox" checked> تحسين الصورة تلقائياً (تدرّج رمادي + تباين)</label>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div id="status">جاري تجهيز المحرك…</div>
</div>

<div class="card">
  <textarea id="out" placeholder="سيظهر النص المستخرج هنا"></textarea>
  <div class="row" style="margin-top:10px">
    <button id="copy" class="sec">نسخ</button>
    <button id="share" class="sec">مشاركة</button>
    <button id="clear" class="sec">مسح</button>
  </div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
let worker = null, queue = Promise.resolve();

function netState(){ $('net').textContent = navigator.onLine ? '' : '· (غير متصل)'; }
addEventListener('online', netState); addEventListener('offline', netState); netState();

async function getWorker(){
  if (worker) return worker;
  status('تحميل محرك العربية (مرة واحدة)…');
  worker = await Tesseract.createWorker('ara', 1, {
    workerPath: 'tess/worker.min.js',
    corePath: 'tess/',
    langPath: 'tess/',
    gzip: false,
    cacheMethod: "none",
    logger: m => {
      if (m.status === 'recognizing text') {
        $('fill').style.width = Math.round(m.progress * 100) + '%';
      }
    }
  });
  await worker.setParameters({ preserve_interword_spaces: '1', user_defined_dpi: '300' });
  return worker;
}

function loadImg(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res({ img, url });
    img.onerror = rej;
    img.src = url;
  });
}

function prepare(img){
  // Scale so the long side is ~2200px, then grayscale + contrast stretch
  const max = 2200, s = Math.min(2, max / Math.max(img.width, img.height));
  const w = Math.round(img.width * s), h = Math.round(img.height * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  if (!$('enh').checked) return c;
  const d = g.getImageData(0, 0, w, h), p = d.data, hist = new Uint32Array(256);
  for (let i = 0; i < p.length; i += 4){
    const v = (p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114) | 0;
    p[i] = v; hist[v]++;
  }
  const total = w * h; let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++){ acc += hist[i]; if (acc > total*0.01){ lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--){ acc += hist[i]; if (acc > total*0.01){ hi = i; break; } }
  const k = 255 / Math.max(1, hi - lo);
  for (let i = 0; i < p.length; i += 4){
    const v = Math.max(0, Math.min(255, (p[i] - lo) * k));
    p[i] = p[i+1] = p[i+2] = v;
  }
  g.putImageData(d, 0, 0);
  return c;
}

async function process(files){
  const list = [...files]; if (!list.length) return;
  $('bar').style.display = 'block';
  try {
    const w = await getWorker();
    for (let i = 0; i < list.length; i++){
      status(`قراءة الصورة ${i+1} من ${list.length}…`);
      $('fill').style.width = '0%';
      const { img, url } = await loadImg(list[i]);
      $('preview').src = url; $('preview').style.display = 'block';
      const canvas = prepare(img);
      const { data } = await w.recognize(canvas);
      const txt = data.text.trim();
      $('out').value += (($('out').value && txt) ? '\n\n' : '') + txt;
      status(`تم — ثقة تقريبية ${Math.round(data.confidence)}%`);
    }
  } catch (e) {
    console.error(e);
    status('حدث خطأ: ' + (e.message || e) + ' — تأكد أن ملفات مجلد tess موجودة.');
  } finally {
    $('bar').style.display = 'none';
  }
}

$('cam').onchange = e => { queue = queue.then(() => process(e.target.files)); e.target.value = ''; };
$('gal').onchange = e => { queue = queue.then(() => process(e.target.files)); e.target.value = ''; };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('out').value); status('تم النسخ'); }
  catch { $('out').select(); document.execCommand('copy'); status('تم النسخ'); }
};
$('share').onclick = () => {
  if (navigator.share) navigator.share({ text: $('out').value }).catch(()=>{});
  else status('المشاركة غير مدعومة، استخدم نسخ');
};
$('clear').onclick = () => { $('out').value = ''; $('preview').style.display = 'none'; status('جاهز'); };

// ---------- First-run installer: downloads engine + Arabic data once, stores them on the phone ----------
const J='https://cdn.jsdelivr.net/npm';
const ASSETS=[
  ['tess/tesseract.min.js', J+'/tesseract.js@5.1.1/dist/tesseract.min.js'],
  ['tess/worker.min.js', J+'/tesseract.js@5.1.1/dist/worker.min.js'],
  ['tess/tesseract-core.wasm.js', J+'/tesseract.js-core@5.1.0/tesseract-core.wasm.js'],
  ['tess/tesseract-core-simd.wasm.js', J+'/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js'],
  ['tess/tesseract-core-lstm.wasm.js', J+'/tesseract.js-core@5.1.0/tesseract-core-lstm.wasm.js'],
  ['tess/tesseract-core-simd-lstm.wasm.js', J+'/tesseract.js-core@5.1.0/tesseract-core-simd-lstm.wasm.js'],
  ['tess/ara.traineddata', 'https://cdn.jsdelivr.net/gh/tesseract-ocr/tessdata_best@main/ara.traineddata']
];
const CACHE='arabic-ocr-v2';

async function ensureAssets(){
  const cache=await caches.open(CACHE);
  const missing=[];
  for(const [local,remote] of ASSETS){
    if(!(await cache.match(new URL(local,location.href)))) missing.push([local,remote]);
  }
  if(!missing.length) return;
  $('bar').style.display='block';
  for(let i=0;i<missing.length;i++){
    const [local,remote]=missing[i];
    status(`تنزيل ملفات التشغيل (${i+1}/${missing.length}) — يحتاج إنترنت مرة واحدة فقط`);
    const r=await fetch(remote);
    if(!r.ok) throw new Error('فشل التنزيل: '+remote.split('/').pop());
    const total=+r.headers.get('content-length')||0;
    const reader=r.body.getReader(), chunks=[]; let got=0;
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      chunks.push(value); got+=value.length;
      if(total) $('fill').style.width=Math.round(got/total*100)+'%';
    }
    await cache.put(new URL(local,location.href), new Response(new Blob(chunks)));
  }
  $('bar').style.display='none'; $('fill').style.width='0%';
}

function loadScript(src){
  return new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('تعذّر تحميل '+src));document.head.appendChild(t);});
}

async function boot(){
  if(!('serviceWorker' in navigator)) throw new Error('المتصفح لا يدعم العمل بدون إنترنت');
  await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller){
    await Promise.race([
      new Promise(r=>navigator.serviceWorker.addEventListener('controllerchange',r,{once:true})),
      new Promise(r=>setTimeout(r,3000))
    ]);
  }
  await ensureAssets();
  await loadScript('tess/tesseract.min.js');
  await getWorker();
  status('جاهز — التقط صورة أو اخترها من المعرض');
}
boot().catch(e=>status('تعذّر التجهيز: '+(e.message||e)+' — افتح الصفحة مرة وأنت متصل بالإنترنت ثم أعد المحاولة.'));
</script>
</body>
</html>
